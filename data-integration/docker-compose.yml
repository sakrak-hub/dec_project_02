version: '3.8'

services:
  postgres-sources:
    build: ./source-db
    container_name: postgres-sources
    ports: 
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: northwind
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airbyte-network
    
  pgadmin:
    image: dpage/pgadmin4:9.10.0
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8080:80"
    depends_on:
    - postgres-sources
    networks:
      - airbyte-network

volumes:
  postgres-data:
  destination-data:

networks:
  airbyte-network:
    driver: bridge